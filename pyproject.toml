[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-antigravity-patcher"
version = "1.3.8"
description = "Open-source cross-platform patcher for Antigravity, Antigravity IDE, CLI, and VS Code extension"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "packaging>=20.0"
]
license = { text = "GPL-3.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.scripts]
open-antigravity-patcher = "patcher.cli:run_cli"

[tool.setuptools.packages.find]
where = ["source"]
